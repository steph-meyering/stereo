name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Ruby / Rails tests + Rubocop
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stereo_test
      RAILS_ENV: test
      # Suppress credential loading in CI
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'ci-placeholder-not-used-in-test' }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # reads .ruby-version (3.2.0)
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run Rails tests
        run: bin/rails test

      - name: Run Rubocop
        run: bundle exec rubocop

  frontend:
    name: Node / ESLint + Jest + Webpack build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        # --ignore-scripts skips the postinstall webpack run (saves ~30s in CI)
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npx eslint frontend

      - name: Jest tests
        run: npm test

      - name: Webpack production build
        run: npm run build

  audit:
    name: npm audit (critical-only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: npm audit
        run: npm audit --audit-level=high
